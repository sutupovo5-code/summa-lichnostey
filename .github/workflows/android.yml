# Сборка Android-приложения «Сумма Личностей» (папка android/).
# Запускается сама при изменениях в android/ или вручную: Actions → «Android APK» → Run workflow.
# Готовый APK выкладывается в Releases; постоянная ссылка на последнюю сборку:
# https://github.com/sutupovo5-code/summa-lichnostey/releases/latest/download/Summa-Lichnostey.apk
#
# Подпись: если в Settings → Secrets → Actions есть ANDROID_KEYSTORE_B64 и ANDROID_KEYSTORE_PASS (алиас summa),
# используется этот постоянный ключ — тогда новые сборки ставятся поверх старых. Иначе — временный ключ
# (новую сборку придётся ставить после удаления старой; данные аккаунта при входе подтянутся из базы).
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          KS="$RUNNER_TEMP/summa.p12"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KS_KIND=постоянный ключ" >> "$GITHUB_ENV"
          else
            PASS="tmp-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
              -alias summa -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Summa Lichnostey, O=Summa, C=RU"
            echo "::add-mask::$PASS"
            echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KS_KIND=временный ключ" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=summa" >> "$GITHUB_ENV"

      - name: Сборка APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Релиз и копия в ветку apk-build
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Summa-Lichnostey.apk
          ls -la Summa-Lichnostey.apk
          gh release create "apk-$N" Summa-Lichnostey.apk \
            --title "Приложение для Android · версия 1.0.$N" \
            --notes "Сборка $N ($KS_KIND). Скачайте Summa-Lichnostey.apk на телефон и откройте файл. Приложение показывает живой сайт — обновления сайта приходят сами." \
            --latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/apkout && cp Summa-Lichnostey.apk /tmp/apkout/
          git checkout --orphan apk-build
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github .nojekyll 2>/dev/null || true
          cp /tmp/apkout/Summa-Lichnostey.apk .
          echo "Сборка $N, $KS_KIND, $(date -u)" > BUILD.txt
          git add -f Summa-Lichnostey.apk BUILD.txt
          git commit -m "APK сборка $N"
          git push -f origin HEAD:apk-build
